<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#050b14"/>
  <g transform="translate(6, 60)">
    <!-- Sunburst Arch -->
    <path d="M 120 150 A 130 130 0 0 1 380 150" fill="none" stroke="#f97316" stroke-width="26" stroke-linecap="round"/>
    
    <!-- Sun Rays -->
    <polygon points="100,140 60,135 90,115" fill="#f97316" />
    <polygon points="140,85 110,45 150,65" fill="#f97316" />
    <polygon points="205,45 195,0 230,25" fill="#f97316" />
    <polygon points="280,30 295,0 305,45" fill="#f97316" />
    <polygon points="350,65 390,45 360,85" fill="#f97316" />
    <polygon points="410,115 440,135 400,140" fill="#f97316" />

    <!-- EWS Logo Text -->
